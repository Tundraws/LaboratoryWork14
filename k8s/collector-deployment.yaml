apiVersion: apps/v1
kind: Deployment
metadata:
  name: metro-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metro-collector
  template:
    metadata:
      labels:
        app: metro-collector
    spec:
      containers:
        - name: collector
          image: metro-collector:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: metro-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

