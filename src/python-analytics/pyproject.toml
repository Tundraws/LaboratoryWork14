[project]
name = "metro-analytics"
version = "0.1.0"
description = "Python analytics service for metro passenger-flow pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "polars>=0.20.30",
  "duckdb>=0.10.3",
  "pyarrow>=16.1.0",
  "nats-py>=2.7.2",
  "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.4.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

